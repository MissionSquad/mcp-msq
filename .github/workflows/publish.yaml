name: Publish to npm

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing: the job proves its identity to the registry with
      # a GitHub OIDC token instead of a stored npm token. The package's npm
      # settings must list this repo + workflow file as a trusted publisher.
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mirrors the workflow in https://docs.npmjs.com/trusted-publishers/
      # (registry-url set, no NODE_AUTH_TOKEN). Requirements per those docs:
      # npm CLI >= 11.5.1 and Node >= 22.14.0.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      # Node 22's bundled npm is 10.x; trusted publishing needs >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Project
        run: yarn build

      - name: Run Tests
        run: yarn test

      - name: Publish to npm
        run: npm publish --access public
