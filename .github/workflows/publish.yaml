name: Publish to npm

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing: the job proves its identity to the registry with
      # a GitHub OIDC token instead of a stored npm token. The package's npm
      # settings must list this repo + workflow file as a trusted publisher.
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm may be older.
      # No registry-url / NODE_AUTH_TOKEN on purpose: a configured token would
      # take precedence over the OIDC exchange.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Project
        run: yarn build

      - name: Run Tests
        run: yarn test

      - name: Publish to npm
        run: npm publish --access public
